# /etc/nginx/sites-available/slaiton.com
# Sitio público (contenedor "web", escucha solo en 127.0.0.1:3000).
#
# MODO TRANSICIÓN (mientras www.slaiton.com siga en Vercel):
#   deja activo solo el primer bloque: slaiton.com redirige a https://www.slaiton.com (Vercel).
# MODO PRODUCCIÓN (después del corte, con www apuntando a este servidor):
#   comenta el bloque de transición y descomenta los dos bloques de producción.

# ---------- Transición ----------
server {
    listen 80;
    listen [::]:80;
    server_name slaiton.com;
    return 301 https://www.slaiton.com$request_uri;
}

