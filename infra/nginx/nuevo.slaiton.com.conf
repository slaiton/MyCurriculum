# /etc/nginx/sites-available/nuevo.slaiton.com  (OPCIONAL, temporal)
# Para revisar el sitio nuevo antes del corte. Requiere un registro A "nuevo" hacia el servidor
# y SITE_URL=https://nuevo.slaiton.com en infra/.env. Se elimina después del corte.
server {
    listen 80;
    listen [::]:80;
    server_name nuevo.slaiton.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
