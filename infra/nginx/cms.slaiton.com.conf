# /etc/nginx/sites-available/cms.slaiton.com
# Panel y API de Strapi (contenedor "cms", escucha solo en 127.0.0.1:1337).
# No necesita carpeta en /var/www: los archivos subidos viven en el volumen Docker "uploads".
server {
    listen 80;
    listen [::]:80;
    server_name cms.slaiton.com;

    client_max_body_size 100m;   # igual al límite de subida de Strapi (videos)

    # Instaladores de las apps (fuera de Strapi: el CMS no acepta ejecutables por seguridad).
    # Viven en la carpeta descargas/<app>/ del repo (solo la última versión, con nombre fijo) y llegan con git pull.
    location /descargas/ {
        alias /var/www/slaiton.com/descargas/;
        autoindex off;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Disposition "attachment";
        # Nombre fijo: el navegador debe revalidar para no servir un instalador viejo tras una actualización.
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
