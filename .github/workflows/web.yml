# OBSOLETO: despliegue antiguo de la app CRA (copia `build/**` a /var/www/html/slaiton.com).
# Desactivado: ya no se ejecuta en cada push. El sitio nuevo se despliega con deploy-web.yml.
# Se conserva solo como referencia hasta retirar la app CRA y `build/`.
name: Curriculum (obsoleto)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Save SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Copy project to server
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -r build/** ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:/var/www/html/slaiton.com
